<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoaTok - Scroll & Watch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --gray: #a1a1a1;
            --primary: #ff2a55; 
            --ai-color: #00f3ff; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* === FEED VIDEO (SCROLL SNAP) === */
        .video-feed {
            height: 100vh; width: 100%; overflow-y: scroll;
            scroll-snap-type: y mandatory; scrollbar-width: none;
        }
        .video-feed::-webkit-scrollbar { display: none; }

        .video-post {
            height: 100vh; width: 100%; scroll-snap-align: start;
            position: relative; display: flex; align-items: center; justify-content: center;
        }

        .video-player { width: 100%; height: 100%; object-fit: cover; }
        
        .video-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
        }

        /* === KONTEN OVERLAY === */
        .bottom-content {
            position: absolute; bottom: 60px; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 15px; z-index: 10;
        }

        .info-left { flex: 1; padding-right: 20px; pointer-events: auto; }
        .username { font-weight: 700; font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .username i { color: var(--ai-color); font-size: 14px; }
        .caption { font-size: 14px; margin-bottom: 10px; line-height: 1.4; }
        .music { font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .music i { animation: spin 3s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .actions-right { display: flex; flex-direction: column; gap: 20px; pointer-events: auto; }
        .action-btn {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            background: none; border: none; color: white; cursor: pointer;
        }
        .action-btn i { font-size: 32px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .action-btn span { font-size: 12px; font-weight: 600; }
        .action-btn.liked i { color: var(--primary); }

        /* === NAV BAWAH === */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50px;
            background: rgba(0,0,0,0.9); border-top: 1px solid #222;
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item { color: var(--gray); text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: white; }
        .nav-item i { font-size: 18px; }

        /* === FLOATING AI BUTTON & CHAT === */
        .ai-btn {
            position: absolute; right: 15px; bottom: 80px; z-index: 100;
            width: 55px; height: 55px; border-radius: 50%;
            background: var(--ai-color); color: black;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer;
            box-shadow: 0 0 15px var(--ai-color);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Chat UI */
        .ai-chat-container {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 60vh;
            background: #111; border-top-left-radius: 20px; border-top-right-radius: 20px;
            border-top: 2px solid var(--ai-color);
            z-index: 999; transition: bottom 0.3s ease;
            display: flex; flex-direction: column;
        }
        .ai-chat-container.open { bottom: 0; }

        .chat-header {
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #222;
        }
        .chat-header h3 { font-size: 16px; color: var(--ai-color); display: flex; align-items: center; gap: 8px; }
        .close-chat { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.4; }
        .msg.ai { background: #222; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.user { background: var(--ai-color); color: black; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 500; }

        .chat-input-area {
            padding: 10px 15px; display: flex; gap: 10px; background: #000;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }
        .chat-input-area input {
            flex: 1; background: #222; border: none; border-radius: 20px;
            padding: 12px 15px; color: white; font-size: 14px; outline: none;
        }
        .send-btn {
            width: 45px; height: 45px; border-radius: 50%; background: var(--ai-color);
            border: none; color: black; font-size: 18px; cursor: pointer;
        }

        /* Animasi Loading Awal */
        #loader { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; gap: 15px; transition: opacity 0.5s; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: 600; font-size: 14px;">Memuat Video...</div>
    </div>

    <!-- AREA VIDEO -->
    <div class="video-feed" id="feed"></div>

    <!-- NAVIGASI BAWAH -->
    <div class="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item"><i class="fa-solid fa-user-group"></i><span>Friends</span></div>
        <div class="nav-item" style="opacity:0"><i class="fa-solid fa-plus"></i><span>+</span></div>
        <div class="nav-item"><i class="fa-solid fa-comment-dots"></i><span>Inbox</span></div>
        <div class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></div>
    </div>

    <!-- TOMBOL AI FLOATING -->
    <button class="ai-btn" onclick="toggleChat()"><i class="fa-solid fa-robot"></i></button>

    <!-- CHAT AI -->
    <div class="ai-chat-container" id="aiChat">
        <div class="chat-header">
            <h3><i class="fa-solid fa-robot"></i> Coarena AI</h3>
            <button class="close-chat" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="msg ai">Halo! Aku AI dari Coarena. Ada yang bisa aku bantu?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="aiInput" placeholder="Tanya AI..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendToAI()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. DATA VIDEO (BISA LO GANTI SENDIRI)
        // ==========================================
        // Gue pakai server Google (Unlimited & Super Cepat). 
        // Lo bisa ganti link videoUrl dan thumbnail pakai punya lo sendiri.
        const VIDEO_DATA = [
            {
                url: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                author: "bunny_official",
                caption: "Petualangan kelinci lucu di hutan! 🐰🌳 #animasi #fun",
                likes: 12450
            },
            {
                url: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
                author: "dream_works",
                caption: "Mimpi aneh dua karakter di dunia misterius. 🤖✨ #3d #art",
                likes: 8920
            },
            {
                url: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                author: "action_scene",
                caption: "Tes ketahanan layar TV pakai api! 🔥📺 #technology",
                likes: 45100
            },
            {
                url: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
                author: "travel_vlog",
                caption: "Escape ke alam bebas. Butuh liburan? 🏕️🏔️",
                likes: 2300
            },
            {
                url: "https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
                author: "fantasy_world",
                caption: "Animasi fantasi kualitas Hollywood. Naga & Pedang! 🐉⚔️",
                likes: 99000
            }
        ];

        // ==========================================
        // 2. KONFIGURASI API AI COARENA
        // ==========================================
        const COARENA_API_KEY = 'coa_3c4bc46469bd77b8f9c915910b036a60';
        const COARENA_ENDPOINT = 'https://coarena.ai/api'; // Ganti dengan URL endpoint API-nya

        // ==========================================
        // 3. RENDER VIDEO & SCROLL TIKTOK
        // ==========================================
        function renderVideos() {
            const feed = document.getElementById('feed');
            
            VIDEO_DATA.forEach((vid, index) => {
                const post = document.createElement('div');
                post.className = 'video-post';
                
                // Atribut 'loop' bikin video ngulang terus
                // Atribut 'muted' wajib biar autoplay jalan di browser HP
                post.innerHTML = `
                    <video class="video-player" src="${vid.url}" loop playsinline autoplay muted onclick="togglePlay(this)"></video>
                    <div class="video-overlay"></div>
                    
                    <div class="bottom-content">
                        <div class="info-left">
                            <div class="username">@${vid.author} <i class="fa-solid fa-circle-check"></i></div>
                            <div class="caption">${vid.caption}</div>
                            <div class="music"><i class="fa-solid fa-compact-disc"></i> Original Sound - ${vid.author}</div>
                        </div>
                        
                        <div class="actions-right">
                            <button class="action-btn" onclick="toggleLike(this, ${vid.likes})">
                                <i class="fa-solid fa-heart"></i>
                                <span class="like-count">${vid.likes}</span>
                            </button>
                            <button class="action-btn">
                                <i class="fa-solid fa-comment-dots"></i>
                                <span>${Math.floor(Math.random() * 500)}</span>
                            </button>
                            <button class="action-btn">
                                <i class="fa-solid fa-share"></i>
                                <span>Share</span>
                            </button>
                        </div>
                    </div>
                `;
                feed.appendChild(post);
            });

            // Hilangin Loading setelah video siap
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);

            setupAutoplay();
        }

        // === LOGIKA PLAY / PAUSE SAAT DI-KLIK ===
        function togglePlay(video) {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        // === LOGIKA AUTO PLAY SAAT DI-SCROLL (SWIPE) ===
        function setupAutoplay() {
            const videos = document.querySelectorAll('.video-player');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play();
                        // entry.target.muted = false; // Buka komen ini kalau mau ada suara (tapi kadang diblokir browser HP)
                    } else {
                        entry.target.pause();
                        entry.target.currentTime = 0; // Reset video dari awal
                    }
                });
            }, { threshold: 0.6 }); // Video play kalau keliatan 60%

            videos.forEach(video => observer.observe(video));
        }

        // === LOGIKA LIKE ===
        function toggleLike(btn, baseLikes) {
            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.innerText);
            
            if (btn.classList.contains('liked')) {
                btn.classList.remove('liked');
                icon.style.color = 'white';
                countSpan.innerText = count - 1;
            } else {
                btn.classList.add('liked');
                icon.style.color = 'var(--primary)';
                countSpan.innerText = count + 1;
            }
        }

        // ==========================================
        // 4. LOGIKA AI CHAT (COARENA)
        // ==========================================
        function toggleChat() {
            const chat = document.getElementById('aiChat');
            chat.classList.toggle('open');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendToAI();
        }

        async function sendToAI() {
            const input = document.getElementById('aiInput');
            const text = input.value.trim();
            if (!text) return;

            // Tampilkan chat user
            addMessage(text, 'user');
            input.value = '';

            // Tampilkan loading
            const loadingMsg = addMessage('Sedang berpikir...', 'ai');

            try {
                // REQUEST KE API COARENA (Placeholder)
                const response = await fetch(COARENA_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${COARENA_API_KEY}`
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: text }]
                    })
                });

                const data = await response.json();
                loadingMsg.remove();

                // Tampilkan jawaban AI
                const aiReply = data.reply || data.message || "Maaf, respon tidak dikenali.";
                addMessage(aiReply, 'ai');

            } catch (error) {
                loadingMsg.remove();
                addMessage("Error: Gagal terhubung ke server AI.", 'ai');
            }
        }

        function addMessage(text, sender) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `msg ${sender}`;
            msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
            return msg;
        }

        // Jalanin Render pas web dibuka
        window.onload = renderVideos;
    </script>
</body>
</html>
