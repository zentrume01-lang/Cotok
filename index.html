<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guru AI Mengambang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-chat: #0f0f13;
            --card: #1a1a24;
            --text: #ffffff;
            --primary: #4285F4; /* Biru Google */
            --ai-bg: #252533;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: transparent; color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* === WIDGET FLOATING (MENGAMBANG) === */
        #floating-ai {
            position: fixed; 
            bottom: 20px; right: 20px; 
            width: 60px; height: 60px;
            background: var(--primary);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; color: white;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.5);
            cursor: pointer; z-index: 9999;
            transition: all 0.3s ease;
        }
        
        /* Efek saat disembunyiin (Tap 3x) */
        #floating-ai.hidden-mode {
            width: 20px; height: 20px; font-size: 0px;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* === CHAT CONTAINER === */
        #chat-container {
            position: absolute; inset: 10px;
            background: var(--bg-chat);
            border-radius: 20px;
            display: none; 
            flex-direction: column;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 10000;
            overflow: hidden;
        }
        
        #chat-container.show { display: flex; animation: popUp 0.3s ease; }
        @keyframes popUp { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* Header */
        .header {
            background: var(--card); padding: 15px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #333;
        }
        .header-title { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .header-title i { color: var(--primary); font-size: 20px; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }

        /* Area Chat */
        .chat-area {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
        }

        .message { display: flex; gap: 10px; max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }

        .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; flex-shrink: 0;
        }
        .message.user .avatar { background: #333; }
        .message.ai .avatar { background: var(--primary); color: white; }

        .bubble {
            padding: 10px 14px; border-radius: 14px;
            font-size: 13px; line-height: 1.5; word-wrap: break-word;
        }
        .message.user .bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .message.ai .bubble { background: var(--ai-bg); border-bottom-left-radius: 4px; }

        /* Input Area */
        .input-area {
            padding: 10px; background: var(--card);
            display: flex; gap: 8px; border-top: 1px solid #333;
        }
        .input-area input {
            flex: 1; background: var(--bg-chat); border: 1px solid #333;
            padding: 10px 14px; border-radius: 20px; color: white;
            outline: none; font-size: 13px;
        }
        .input-area input:focus { border-color: var(--primary); }
        .input-area button {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--primary); color: white;
            border: none; cursor: pointer; font-size: 16px;
        }
        .input-area button:disabled { background: #555; }

        /* Animasi Loading */
        .typing { display: inline-flex; gap: 4px; }
        .typing span { width: 5px; height: 5px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- LOGO ROBOT MENGAMBANG -->
    <div id="floating-ai" onclick="toggleChat()">
        <i class="fa-solid fa-robot"></i>
    </div>

    <!-- KOTAK CHAT AI -->
    <div id="chat-container">
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-robot"></i> Guru AI Pintar
            </div>
            <button class="close-btn" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message ai">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="bubble">Halo murid! Saya Guru AI Anda. Mau belajar apa hari ini? (Matematika, IPA, Bahasa, atau Kuliah?)</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Tanya PR atau materi..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚨 KONFIGURASI: UBAH URL PTERODACTYL LO DI SINI
        // ==========================================
        // Jangan lupa ganti pakai URL panel lo
        const PTERO_API = 'http://public.zhaher.my.id:2681/api/gemini';
        
        // Prompt Rahasia Guru Pintar (SD - Kuliah)
        const SYSTEM_INSTRUCTION = "Kamu adalah Guru AI yang sangat pintar, sabar, dan ramah. Tugasmu adalah mengajar murid dari tingkat SD hingga Kuliah. Gunakan bahasa yang mudah dipahami, berikan contoh nyata, dan bimbing mereka langkah demi langkah jika ada soal matematika atau sains. Jika ditanya di luar pelajaran, jawab dengan sopan sebagai seorang pendidik.";

        let currentSessionId = null;
        let tapCount = 0;
        let tapTimer = null;

        const chatArea = document.getElementById('chatArea');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const floatingBtn = document.getElementById('floating-ai');
        const chatContainer = document.getElementById('chat-container');

        // ==========================================
        // GESTUR RAHASIA: TAP 3X DI LAYAR
        // ==========================================
        document.body.addEventListener('click', (e) => {
            // Abaikan kalau yang diklik adalah tombol chat/input
            if (e.target.closest('#chat-container') || e.target.closest('#floating-ai')) return;

            tapCount++;
            if (tapCount === 1) {
                tapTimer = setTimeout(() => { tapCount = 0; }, 600);
            }

            if (tapCount === 3) {
                clearTimeout(tapTimer);
                tapCount = 0;
                floatingBtn.classList.toggle('hidden-mode');
                if (chatContainer.classList.contains('show')) {
                    chatContainer.classList.remove('show');
                }
            }
        });

        // ==========================================
        // LOGIKA BUKA/TUTUP CHAT
        // ==========================================
        function toggleChat() {
            if (floatingBtn.classList.contains('hidden-mode')) return;
            chatContainer.classList.toggle('show');
            if (chatContainer.classList.contains('show')) {
                chatInput.focus();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // ==========================================
        // LOGIKA KIRIM PESAN (BYPASS CORS VIA PROXY)
        // ==========================================
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            chatInput.value = '';
            
            const loadingBubble = appendLoading();
            sendBtn.disabled = true;

            try {
                // Kita nembak lewat Proxy (Public CORS Proxy) biar Vercel (HTTPS) bisa akses Ptero (HTTP)
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(PTERO_API);

                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        instruction: SYSTEM_INSTRUCTION,
                        sessionId: currentSessionId 
                    })
                });

                const data = await response.json();
                loadingBubble.remove();

                if (data.status === 'success') {
                    appendMessage(data.text, 'ai');
                    if (data.sessionId) currentSessionId = data.sessionId;
                } else {
                    appendMessage("❌ Error: " + (data.error || "Gagal konek ke server"), 'ai');
                }

            } catch (error) {
                loadingBubble.remove();
                appendMessage("❌ Koneksi terputus. Pastikan server Pterodactyl nyala dan URL benar.", 'ai');
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ==========================================
        // FUNGSI UI CHAT
        // ==========================================
        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const icon = sender === 'user' ? 'fa-user' : 'fa-robot';
            
            let formattedText = text.replace(/\n/g, '<br>');
            formattedText = formattedText.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

            msgDiv.innerHTML = `
                <div class="avatar"><i class="fa-solid ${icon}"></i></div>
                <div class="bubble">${formattedText}</div>
            `;
            
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function appendLoading() {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ai`;
            msgDiv.innerHTML = `
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="bubble">
                    <div class="typing"><span></span><span></span><span></span></div>
                </div>
            `;
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
